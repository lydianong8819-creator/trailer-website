<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>AUTO ZHONGRISES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f7fa;color:#222;margin:0 auto;max-width:480px;width:100%;}
.app-header{background:#152238;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;}
.logo{font-size:18px;font-weight:bold;}
.lang-wrap select{padding:6px 8px;border-radius:4px;border:none;background:#fff;color:#152238;outline:none;}
.page-container{padding:16px;padding-bottom:80px;min-height:calc(100vh - 130px);}
.page{display:none;}
.page.active{display:block;}
.page h2{font-size:20px;margin-bottom:16px;color:#152238;line-height:1.4;}
.card{background:#f7f9fc;border-radius:10px;padding:16px;margin-bottom:12px;}
.card p{line-height:1.7;font-size:15px;color:#333;}
.product-item{background:#f7f9fc;border-radius:10px;padding:14px;margin:10px 0;}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#fff;display:flex;border-top:1px solid #eee;z-index:99;}
.tab-item{flex:1;text-align:center;padding:12px 4px;font-size:13px;color:#666;cursor:pointer;}
.tab-item.active{color:#0052cc;font-weight:bold;}
.form-item{margin:14px 0;}
.form-item label{display:block;margin-bottom:6px;font-size:14px;color:#333;}
.form-item input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:15px;outline:none;}
.btn{width:100%;padding:14px;border:none;border-radius:8px;margin:10px 0;font-size:16px;cursor:pointer;font-weight:500;}
.btn-primary{background:#0052cc;color:#fff;}
.btn-whatsapp{background:#25d366;color:#fff;}
.footer-slogan{margin-top:24px;text-align:center;font-size:14px;color:#555;line-height:1.6;}
</style>
</head>
<body>
<div class="app-header">
    <div class="logo">AUTO ZHONGRISES</div>
    <div class="lang-wrap">
        <select id="langSelect">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="pt">Português</option>
        </select>
    </div>
</div>

<div class="page-container">
    <div class="page active" data-page="home">
        <h2 data-i18n="home.title"></h2>
        <div class="card">
            <p data-i18n="home.desc"></p>
        </div>
    </div>

    <div class="page" data-page="factory">
        <h2 data-i18n="factory.pageTitle"></h2>
        <div class="card"><p data-i18n="factory.item1"></p></div>
        <div class="card"><p data-i18n="factory.item2"></p></div>
        <div class="card"><p data-i18n="factory.item3"></p></div>
        <div class="card"><p data-i18n="factory.item4"></p></div>
    </div>

    <div class="page" data-page="products">
        <h2 data-i18n="products.pageTitle"></h2>
        <div class="product-item"><p data-i18n="products.flatbed"></p></div>
        <div class="product-item"><p data-i18n="products.lowbed"></p></div>
        <div class="product-item"><p data-i18n="products.fence"></p></div>
        <div class="product-item"><p data-i18n="products.tanker"></p></div>
        <div class="product-item"><p data-i18n="products.dump"></p></div>
        <div class="card">
            <p data-i18n="products.serviceTip"></p>
        </div>
    </div>

    <div class="page" data-page="service">
        <h2 data-i18n="africaService.pageTitle"></h2>
        <div class="card"><p data-i18n="africaService.item1"></p></div>
        <div class="card"><p data-i18n="africaService.item2"></p></div>
        <div class="card"><p data-i18n="africaService.item3"></p></div>
        <div class="card"><p data-i18n="africaService.item4"></p></div>
    </div>

    <div class="page" data-page="contact">
        <h2 data-i18n="contact.pageTitle"></h2>
        <div class="form-item">
            <label data-i18n="contact.form.name"></label>
            <input type="text" id="cName">
        </div>
        <div class="form-item">
            <label data-i18n="contact.form.country"></label>
            <input type="text" id="cCountry">
        </div>
        <div class="form-item">
            <label data-i18n="contact.form.trailerType"></label>
            <input type="text" id="cTrailer">
        </div>
        <div class="form-item">
            <label data-i18n="contact.form.quantity"></label>
            <input type="text" id="cNum">
        </div>
        <button class="btn btn-whatsapp" id="waBtn" data-i18n="contact.btn2"></button>
        <div class="footer-slogan" data-i18n="contact.footerSlogan"></div>
    </div>
</div>

<div class="tab-bar">
    <div class="tab-item active" data-target="home" data-i18n="tab.home"></div>
    <div class="tab-item" data-target="factory" data-i18n="tab.factory"></div>
    <div class="tab-item" data-target="products" data-i18n="tab.products"></div>
    <div class="tab-item" data-target="service" data-i18n="tab.service"></div>
    <div class="tab-item" data-target="contact" data-i18n="tab.contact"></div>
</div>

<script>
// 填写你的WhatsApp号码 国家号+号码，例如尼日利亚 +234xxxxxxxx
const myWhatsApp = "234你的号码";

const locales = {
en:{
  tab:{home:"Home",factory:"Factory",products:"Products",service:"Africa Service",contact:"Contact"},
  home:{title:"16 Years Professional Semi-Trailer Manufacturer Since 2008",desc:"Founded in 2008, we focus on R&D, production and international export of various semi-trailers and special heavy transport equipment. We are a trusted supplier for logistics and construction companies all over Africa."},
  factory:{pageTitle:"Manufacturing Strength",item1:"3 professional production plants, total area 180,000 square meters",item2:"Annual production capacity: 15,000 units",item3:"More than 400 skilled technicians and professional engineers",item4:"Automatic laser cutting equipment, robot welding lines, standard paint spraying workshop"},
  products:{pageTitle:"Product Portfolio",flatbed:"Flatbed Semi-trailer, suitable for general cargo transportation",lowbed:"Lowbed heavy-duty trailer for oversized cargo",fence:"Fence semi-trailer for bulk goods transport",tanker:"Oil & fuel tanker semi-trailer",dump:"Dump tipper semi-trailer for construction materials",serviceTip:"✅ Custom special heavy trailers\n✅ Truck remanufacturing & refurbishment\n✅ OEM & ODM full customization accepted"},
  africaService:{pageTitle:"Africa Local Service Network",item1:"We have established localized service stations in many African countries",item2:"24/7 remote technical support online",item3:"Stable and fast spare parts supply channel",item4:"On-site maintenance service, reduce vehicle downtime"},
  contact:{pageTitle:"Contact & Get Quotation",form:{name:"Name",country:"Country",trailerType:"Trailer Type you need",quantity:"Quantity"},btn2:"Chat on WhatsApp Directly",footerSlogan:"Drive your business forward with AUTO ZHONGRISES"}
},
fr:{
  tab:{home:"Accueil",factory:"Usine",products:"Produits",service:"Service Afrique",contact:"Contact"},
  home:{title:"16 ans d'expérience fabricant de semi-remorques depuis 2008",desc:"Fondée en 2008, notre entreprise se spécialise dans la R&D, la fabrication et l'export international de semi-remorques et équipements de transport lourd spécialisés. Nous sommes un partenaire fiable pour les entreprises de logistique et de construction en Afrique."},
  factory:{pageTitle:"Capacité de fabrication",item1:"3 usines de production spécialisées, superficie totale de 180 000 m²",item2:"Capacité de production annuelle: 15 000 unités",item3:"Plus de 400 techniciens qualifiés et ingénieurs professionnels",item4:"Équipement de coupe laser automatique, chaînes de soudure robotisées, atelier de peinture professionnel"},
  products:{pageTitle:"Gamme complète de produits",flatbed:"Semi-remorque plateau, adapté au transport de marchandises générales",lowbed:"Semi-remorque surbaissée pour charges lourdes et volumineuses",fence:"Semi-remorque à barrières pour marchandises en vrac",tanker:"Semi-remorque citerne à carburant",dump:"Semi-remorque benne basculante pour matériaux de construction",serviceTip:"✅ Semi-remorques spéciaux sur mesure\n✅ Remise en état et reconstruction de camions\n✅ Service OEM / ODM entièrement personnalisable"},
  africaService:{pageTitle:"Réseau de services locaux en Afrique",item1:"Nous avons mis en place des centres de service locaux dans de nombreux pays africains",item2:"Assistance technique à distance disponible 24h/24",item3:"Approvisionnement rapide et stable en pièces détachées",item4:"Intervention sur place pour limiter l'arrêt des véhicules"},
  contact:{pageTitle:"Contactez-nous et demandez un devis",form:{name:"Nom",country:"Pays",trailerType:"Type de semi-remorque souhaité",quantity:"Quantité"},btn2:"Discuter directement sur WhatsApp",footerSlogan:"Faites progresser votre entreprise avec AUTO ZHONGRISES"}
},
pt:{
  tab:{home:"Início",factory:"Fábrica",products:"Produtos",service:"Serviços África",contact:"Contato"},
  home:{title:"16 anos como fabricante profissional de semirreboques desde 2008",desc:"Fundada em 2008, somos especializados em P&D, produção e exportação internacional de semirreboques e equipamentos de transporte pesado especiais. Somos um fornecedor confiável para empresas de logística e construção em toda a África."},
  factory:{pageTitle:"Capacidade produtiva",item1:"3 fábricas especializadas, área total de 180.000 metros quadrados",item2:"Capacidade de produção anual: 15.000 unidades",item3:"Mais de 400 técnicos qualificados e engenheiros profissionais",item4:"Equipamento de corte a laser automático, linhas de soldagem robótica, oficina de pintura padrão"},
  products:{pageTitle:"Catálogo de produtos",flatbed:"Semirreboque plataforma, ideal para transporte de cargas gerais",lowbed:"Semirreboque baixa altura para cargas pesadas e oversized",fence:"Semirreboque gradeado para transporte de mercadorias a granel",tanker:"Semirreboque tanque de combustível",dump:"Semirreboque basculante para materiais de construção",serviceTip:"✅ Semirreboques especiais customizados\n✅ Recondicionamento de caminhões\n✅ Atendimento OEM e ODM totalmente personalizado"},
  africaService:{pageTitle:"Rede de atendimento local na África",item1:"Dispomos de postos de atendimento locais em vários países africanos",item2:"Suporte técnico remoto 24 horas por dia",item3:"Fornecimento rápido e constante de peças de reposição",item4:"Atendimento no local para reduzir o tempo de parada da frota"},
  contact:{pageTitle:"Entre em contato e solicite uma cotação",form:{name:"Nome",country:"País",trailerType:"Tipo de semirreboque desejado",quantity:"Quantidade"},btn2:"Conversar diretamente no WhatsApp",footerSlogan:"Impulsione o seu negócio com a AUTO ZHONGRISES"}
}
};

function getValue(obj,path){
  return path.split('.').reduce((o,k)=>o?.[k],obj);
}
function setLang(lang){
  const dict=locales[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    el.textContent=getValue(dict,k);
  });
}

// Tab切换
const tabs=document.querySelectorAll('.tab-item');
const pages=document.querySelectorAll('.page');
tabs.forEach(tab=>{
  tab.onclick=()=>{
    const target=tab.dataset.target;
    tabs.forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    pages.forEach(p=>{
      p.classList.toggle('active',p.dataset.page===target);
    })
  }
})

// WhatsApp一键跳转
document.getElementById('waBtn').addEventListener('click',function(){
  const name = document.getElementById('cName').value;
  const country = document.getElementById('cCountry').value;
  const trailer = document.getElementById('cTrailer').value;
  const num = document.getElementById('cNum').value;
  let msg = `Hello AUTO ZHONGRISES
Name:${name}
Country:${country}
Trailer type:${trailer}
Quantity:${num}`;
  const url = `https://wa.me/${myWhatsApp}?text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
});

//语言切换
document.getElementById('langSelect').onchange=e=>{
  setLang(e.target.value);
};
setLang('en');
</script>
</body>
</html>
