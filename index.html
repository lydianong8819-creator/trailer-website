<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 手机自适应必备 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semi-Trailer Products</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #f8f9fa;
        }
        .product-wrap {
            margin: 60px auto;
            width: 95%;
            max-width: 1200px;
        }
        .product-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 28px;
            color: #222;
        }
        .product-grid {
            display: grid;
            /* 自适应多列，最小卡片宽度280px */
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .product-item {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .product-item img {
            width: 100%;
            border-radius: 6px;
            display: block;
        }
        .product-item p {
            text-align: center;
            margin-top: 12px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

<section class="product-wrap">
    <h2 class="product-title">Our Semi-Trailer Models</h2>
    <div class="product-grid">
        <!-- 平板1 -->
        <div class="product-item">
            <img loading="lazy" src="1.jpg" alt="Flatbed Semi-trailer">
            <p>Flatbed Semi-trailer</p>
        </div>
        <!-- 侧帘挂车 -->
        <div class="product-item">
            <img loading="lazy" src="2.jpg" alt="Curtain Side Semi-trailer">
            <p>Curtain Side Semi-trailer</p>
        </div>
        <!-- 带坡道的低平板挂车 -->
        <div class="product-item">
            <img loading="lazy" src="3.jpg" alt="Fence Cargo Semi-trailer">
            <p>Lowbed Flatbed Trailer With Ramps</p>
        </div>
        <!-- 低平板鹅颈挂车 -->
        <div class="product-item">
            <img loading="lazy" src="4.jpg" alt="Lowbed Gooseneck Trailer">
            <p>Lowbed Gooseneck Trailer</p>
        </div>
        <!-- 低平板挂车 -->
        <div class="product-item">
            <img loading="lazy" src="7.jpg" alt="Self-dumping Tipper Trailer">
            <p>Lowbed Semi-trailer</p>
        </div>
    </div>
</section>

</body>
</html>
