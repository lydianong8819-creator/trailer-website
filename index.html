<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO ZHONGRISES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#fff;color:#333;}

/* 顶部头部 */
.top-bar{max-width:1200px;margin:0 auto;padding:20px 15px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:36px;font-weight:bold;color:#162544;}
.search-box{display:flex;}
.search-input{border:1px solid #ddd;padding:9px;width:260px;}
.search-btn{background:#ff8800;color:#fff;border:none;padding:0 15px;}

/* 导航栏 */
.nav{background:#162544;}
.nav-wrap{max-width:1200px;margin:0 auto;display:flex;list-style:none;}
.nav li a{color:#fff;text-decoration:none;padding:16px 20px;display:block;}

/* ==========首页视频 强制显示========== */
.banner-video{max-width:1200px;margin:0 auto 30px;width:100%;}
.banner-video video{width:100%;display:block;}

/* 产品横排4列布局 */
.container{max-width:1200px;margin:0 auto;padding:0 15px;}
.title-h2{font-size:22px;color:#162544;margin:40px 0 20px;}
.product-list{display:grid;grid-template-columns:repeat(4,1fr);gap:25px;}
.product-item{border:1px solid #eee;text-align:center;padding:15px;}
.product-item img{width:100%;height:220px;object-fit:cover;}

/* 右下角悬浮WhatsApp */
.whatsapp-fixed{position:fixed;right:20px;bottom:30px;background:#25d366;color:#fff;padding:12px 20px;border-radius:30px;text-decoration:none;font-weight:bold;}
</style>
</head>
<body>

<div class="top-bar">
    <div class="logo">AUTO ZHONGRISES</div>
    <div class="search-box">
        <input class="search-input" placeholder="Search">
        <button class="search-btn">Q</button>
    </div>
    <div>WhatsApp</div>
</div>

<ul class="nav nav-wrap">
    <li><a href="/trailer-website/">Home</a></li>
    <li><a href="#">About Us</a></li>
    <li><a href="#">Product Center</a></li>
    <li><a href="#">Africa Service</a></li>
    <li><a href="#">Contact Us</a></li>
</ul>

<!-- 视频区域，最先加载 -->
<div class="banner-video">
    <video autoplay muted loop playsinline>
        <source src="6.mp4" type="video/mp4">
    </video>
</div>

<div class="container">
<h2 class="title-h2">Flatbed Semi-trailer Series</h2>
<div class="product-list">
<div class="product-item">
<img src="1.jpg">
<p>60 Ton Flatbed Semi Trailer</p>
</div>
</div>

<h2 class="title-h2">Lowbed Semi-trailer Series</h2>
<div class="product-list">
<div class="product-item">
<img src="3.jpg">
<p>60 Ton Lowbed Semi Trailer</p>
</div>
<div class="product-item">
<img src="4.jpg">
<p>Gooseneck Lowbed Trailer</p>
</div>
<div class="product-item">
<img src="7.jpg">
<p>Heavy Duty Lowbed Semi Trailer</p>
</div>
</div>

</div>

<a href="#" class="whatsapp-fixed">WhatsApp Online</a>

</body>
</html>
